# Keys only, no root, and only from NetBird (100.64.0.0/10) for user andrew.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
MaxAuthTries 3
X11Forwarding no
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u
AllowUsers andrew@100.64.0.0/10
